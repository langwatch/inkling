# Viewers for a spoken script: a narrated lesson or video, heard once, in order, by people
# whose time is short. `inkling readers listen` feeds them the script in chunks of about 30 seconds.
stance: warm
context:
  author: a small company or its founder showing what they learned
  arrived_from: a link a colleague dropped in a team chat
audience:
  product: acme   # the product whose buyers read this: audiences/<name>.yaml or a path
personas:
  - id: busy-lead
    segment: reader
    view: full
    background: >
      A team lead at a 40-person software company. Some of the team use AI for
      customer emails and release notes. Clicked the link because a colleague said
      "worth a look"; a meeting starts in 15 minutes.
  - id: sales-cofounder
    segment: reader
    view: full
    background: >
      The sales co-founder of a 12-person startup who sends AI-drafted outreach
      and decks. Not an engineer. Watching between two customer calls, with the
      next one starting soon.
expectations:
  - id: follows
    segment: reader
    core: true
    expect: After each chunk the viewer can say what the part is about and what the last point was.
  - id: no_skip
    segment: reader
    core: true
    expect: The viewer keeps watching at every chunk.
  - id: examples_land
    segment: reader
    core: true
    expect: The viewer explains each example back and what it proved.
