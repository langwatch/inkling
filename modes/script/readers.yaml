# Listeners for a spoken script: a narrated lesson or video, heard once, in order.
# `inkling readers listen` feeds them the script in 30 to 45 second chunks.
context:
  author: a small company or its founder teaching what they learned
  size: an early product, no famous customers
  arrived_from: a link in a post, a newsletter or a README
  attention: they keep listening while each part is clear and earns the next minute
personas:
  - id: learner
    view: full
    background: >
      An engineer or founder who uses AI agents at work and clicked a short video
      lesson to learn something they can use this week. Listens with the video in a
      side tab, gives it a fair chance, and skips ahead when they lose the thread
      or a part feels like filler.
  - id: busy-lead
    view: full
    background: >
      A team lead watching on a phone between meetings. Generous to small teams and
      fine with a plain delivery, but wants to know early what the lesson covers and
      roughly where they are in it. Closes the tab when a part runs on with no point.
expectations:
  - id: follows
    core: true
    expect: After each chunk the listener can say where they are in the lesson and what the last point was.
  - id: no_skip
    core: true
    expect: The listener does not want to skip ahead at any chunk.
  - id: examples_land
    core: true
    expect: The listener explains each example back and what it proved.
  - id: agenda
    expect: The listener says the agenda back.
