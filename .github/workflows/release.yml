# Publish @langwatch/inkling to npm when main changes what the package ships.
#
# Version: the next patch after the newest published one (package.json's version on the first
# publish), set only inside this run and never committed back, so a release makes no commit of its
# own. A clone tracks main through git; an install learns of a new version from the npm registry.
#
# Publishes through npm Trusted Publishing (OIDC): npmjs.com trusts langwatch/inkling's release.yml,
# so no npm token is stored anywhere. Needs npm 11.5.1 or later.

name: release

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "src/**"
      - "rules/**"
      - "modes/**"
      - "judges/**"
      - "data/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the v<version> tag
  id-token: write # npm provenance and Trusted Publishers

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: npm with Trusted Publishing support
        run: npm install -g npm@11.6.2

      - name: Test
        run: npm test

      - name: Resolve the version
        id: version
        run: |
          set -e
          name="$(node -p "require('./package.json').name")"
          base="$(node -p "require('./package.json').version")"
          published="$(npm view "$name" version 2>/dev/null || true)"
          if [ -z "$published" ]; then
            next="$base"
          else
            next="$(node -e '
              const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
              const newer = a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2];
              const top = newer ? a : b;
              console.log(newer ? top.join(".") : `${top[0]}.${top[1]}.${top[2] + 1}`);
            ' "$base" "$published")"
          fi
          echo "published: ${published:-none}, package.json: $base, releasing: $next"
          npm version "$next" --no-git-tag-version --allow-same-version
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Check the package contents
        run: |
          set -e
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const bad = files.filter((f) => /^(test|tools|scenarios|examples|runs)\/|\.claude\/|__pycache__|corpus/.test(f));
            if (bad.length) { console.error("refusing to publish:", bad.join(", ")); process.exit(1); }
            console.log(files.length + " files");
          '

      # npm refuses provenance from a private repository; it turns on once the repo is public.
      - name: Publish to npm
        env:
          PROVENANCE: ${{ github.event.repository.private == false }}
        run: npm publish --access public --provenance="$PROVENANCE"

      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
